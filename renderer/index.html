<!doctype html>
<meta charset="utf-8">
<title>Lorvath Fleet</title>
<style>
  :root { --bg:#0b0e14; --card:#131824; --line:#232c3d; --txt:#dfe6f3; --dim:#8b96ad; --gold:#e0b055; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:13px/1.4 system-ui,Segoe UI,sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:8px 12px; background:#0e1320; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header h1 { font-size:14px; margin:0 12px 0 0; letter-spacing:.5px; color:var(--gold); }
  button { background:#1b2334; color:var(--txt); border:1px solid var(--line); border-radius:5px; padding:5px 9px; cursor:pointer; font-size:12px; }
  button:hover { background:#243049; }
  button.gold { background:var(--gold); color:#241a06; border-color:#b88a2e; font-weight:600; }
  button.danger { border-color:#5c2626; color:#ffb4b4; }
  label.toggle { display:flex; align-items:center; gap:5px; color:var(--dim); font-size:12px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(430px,1fr)); gap:10px; padding:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; }
  .card.blocked { border-color:#6b2a2a; }
  .chead { display:flex; align-items:center; gap:8px; padding:7px 10px; background:#0f1524; border-bottom:1px solid var(--line); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); flex:none; }
  .dot.ready { background:var(--ok); } .dot.needs_auth { background:var(--warn); }
  .dot.error, .dot.blocked { background:var(--bad); }
  .name { font-weight:600; }
  .name[contenteditable]:focus { outline:1px solid var(--gold); }
  .spacer { flex:1; }
  .stats { display:flex; flex-wrap:wrap; gap:4px 14px; padding:6px 10px; color:var(--dim); font-size:12px; border-bottom:1px solid var(--line); }
  .stats b { color:var(--txt); font-weight:600; }
  .view { position:relative; background:#05070c; height:300px; }
  .view webview { width:100%; height:100%; border:0; display:block; }
  .parked { display:flex; align-items:center; justify-content:center; height:100%; color:var(--dim); font-size:12px; gap:8px; }
  .actions { display:flex; flex-wrap:wrap; gap:5px; padding:7px 10px; }
  .err { color:var(--bad); font-size:11px; padding:0 10px 7px; word-break:break-word; }
  .rules { display:flex; gap:8px; align-items:center; padding:0 10px 8px; color:var(--dim); font-size:11px; flex-wrap:wrap; }
  .rulestate { flex-basis:100%; }
  .rulestate.ok { color:var(--ok); } .rulestate.warn { color:var(--warn); }
  .rules input { width:56px; background:#0d1220; color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:2px 4px; }
  .empty { padding:40px; color:var(--dim); text-align:center; grid-column:1/-1; }
</style>
<header>
  <h1>LORVATH FLEET</h1>
  <button class="gold" id="add">+ Conta</button>
  <button id="refreshAll">Atualizar tudo</button>
  <label class="toggle" title="Fecha todas as janelas do jogo para poupar memória. Sem a janela não há dados ao vivo, então as regras automáticas ficam em pausa."><input type="checkbox" id="lightMode"> modo leve (sem janelas, pausa as regras)</label>
  <label class="toggle"><input type="checkbox" id="killSwitch"> parar regras automáticas</label>
  <span class="spacer"></span>
  <span id="summary" style="color:var(--dim)"></span>
</header>
<div id="grid"></div>
<script src="app.js"></script>
